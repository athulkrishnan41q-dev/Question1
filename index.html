<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
     <!-- Bootsrap -->
     <!-- css -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <!-- js -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>


    <h1 style="text-align: center;">Task Tracker</h1>
    <div style="display: flex;flex-direction: row;justify-content: center;column-gap: 30px;">
        <div style="display: flex;flex-direction: column;border: 2px solid black;justify-items: center;padding: 20px;">
            <h3 style="text-align: center;">Add Task</h3>
            <label>Task No</label>
            <input id="taskno" type="text">
            <label>Title</label>
            <input id="titl" type="text">
            <label>Description</label>
            <input id="desc" type="text">
            <div style="padding-top: 8px;text-align: center;">
                <button onclick="Add()" type="button" class="btn btn-success" data-mdb-ripple-init>Add Task</button>
            </div>
            
           
        </div>
        <div style="display: flex;flex-direction: column;border: 2px solid black;justify-items: center;padding: 20px;">
            <h3 style="text-align: center;">View Task</h3>
            <label>Task No</label>
            <input id="viewno" type="text">
            <div style="padding-top: 8px;text-align: center;">
                <button onclick="View()" type="button" class="btn btn-warning" data-mdb-ripple-init>Add Task</button>
            </div>
            <div id="result">

            </div>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
